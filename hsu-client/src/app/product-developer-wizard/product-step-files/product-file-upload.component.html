<pm-file-upload
    [localisations]="localisations"
    [(sharepointLink)]="sharepointLink"
    [(productDescription)]="productDescription"
    [fileData]="fileData"
    [isAdminView]="isAdminView"
    (onFileDelete)="onDeleteFile($event)"
    (productDescriptionChange)="validateFormData()"
    (sharepointLinkChange)="validateFormData()"
>

    <ng-template>
        <pm-upload
            ng2FileDrop
            (fileOver)="fileOverDropZone({
                fileOver: $event,
                category: ProductFileCategory.ProductDescription
            })"
            (onFileDrop)="onFileDrop(
            {
                fileItems: $event,
                category: ProductFileCategory.ProductDescription
            }

            )"
            [active]="productDescriptionActive"
            [disabled]="uploader.isUploading"
            [uploadId]="ProductFileCategory.ProductDescription.toString()"
            [uploadLabel]="'ProductCreateOrEditFiles.UploadCategory.ProductDescription' | localize"
            [uploadText]="'ProductCreateOrEditFiles.UploadText' | localize"
            [uploadTextLabel]="'ProductCreateOrEditFiles.uploadTextLabel' | localize"
            [fileTag]="'ProductCreateOrEditFiles.FileTag' | localize"
            [required]="true"
            (onFilesSelected)="onFilesSelected($event)"
        />
    </ng-template>

        <pm-upload
            ng2FileDrop
            [active]="productPictureActive"
            [disabled]="uploader.isUploading"

            [uploadText]="'ProductCreateOrEditFiles.UploadText' | localize"
            [uploadTextLabel]="'ProductCreateOrEditFiles.uploadTextLabel' | localize"

            [required]="true"
            (fileOver)="fileOverDropZone({
