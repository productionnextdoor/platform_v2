<pm-wizard
    *ngIf="showWizard"
    [context]="isAdminView ? ('DeveloperProductWizard.AdminTitle' | localize) + ':' : ('DeveloperProductWizard.Title' | localize) + ':'"
    [title]="title"
    [steps]="steps"
    [step]="isAdminView ? WizardStepType.General : currentStep"
    [progress]="currentStep"
    [localisations]="localisations.wizard"
    [isValid]="isValid"
    [processingNextStepSuccess]="processingNextStepSuccess.asObservable()"
    [isAdminView]="isAdminView"
    (onStepChange)="onStepChange()"
    (onSave)="onSave($event)"
    (onFinalize)="onFinalize()"
    (onCancel)="onClose.emit()"
>
    <ng-template>
        <product-create-or-edit-general
            [productId]="productId"
            [(isValid)]="isValid"
            [saveGeneralInfo]="saveGeneralInfo.asObservable()"
            [isAdminView]="isAdminView"
            (onSaveSuccess)="handleSaveResult($event)"
        />
    </ng-template>

    <ng-template>
        <product-material-groups-step
            [productId]="productId"
            [(isValid)]="isValid"
            [saveMaterialGroups]="saveMaterialGroups.asObservable()"
            [isAdminView]="isAdminView"
            (onSaveSuccess)="handleSaveResult($event)"
        />
    </ng-template>

    <ng-template>
        <product-developer-wizard-variants
            [productId]="productId"
            [(isValid)]="isValid"
            [saveVariantInfo]="saveVariantInfo.asObservable()"
            [isAdminView]="isAdminView"
            (onSaveSuccess)="handleSaveResult($event)"
        />
    </ng-template>

    <ng-template>
        <product-sorting-measurements
            [productId]="productId"
            [(isValid)]="isValid"
            [saveSortingInfo]="saveSortingInfo.asObservable()"
            [isAdminView]="isAdminView"
            (onSaveSuccess)="handleSaveResult($event)"
        />
    </ng-template>

    <ng-template>
        <product-file-upload
            [productId]="productId"
            [(isValid)]="isValid"
            [saveUploadInfo]="saveUploadInfo.asObservable()"
            [isAdminView]="isAdminView"
            (onSaveSuccess)="handleSaveResult($event)"
        />
    </ng-template>
</pm-wizard>
