<div class="admin-producer-profile-edit">
    <pm-popup
        [type]="PopupType.MEDIUM"
        [title]="localisations.popupTitle"
        (onClose)="onCancelClick()">
        <div class="admin-producer-profile-edit__subtitle">
            {{ localisations.popupSubtitle }}
        </div>
        <pm-row [template]="'1fr 1fr'" [gap]="margins.XLarge">
            <pm-col [gap]="margins.Small">
                <pm-input
                    [type]="EPmInputType.TEXT"
                    [name]="localisations.labels.companyName"
                    [label]="localisations.labels.companyName"
                    [placeholder]="localisations.labels.companyName"
                    [hasError]="adminProducerProfileEditErrors.companyName"
                    [errorMessages]="localisations.inputErrorMessages"
                    [(value)]="producer.companyName"
                    [required]="true"
                    (click)="resetFormErrors()"
                    (valueChange)="resetFormErrors()"
                    class="admin-producer-profile-edit__input">
                </pm-input>
                <pm-dropdown
                    [name]="localisations.labels.tradeType"
                    [label]="localisations.labels.tradeType"
                    [placeholder]="localisations.labels.tradeType"
                    [required]="true"
                    [hasError]="adminProducerProfileEditErrors.tradeType"
                    [errorMessages]="localisations.inputErrorMessages"
                    [value]="this.producer?.trade?.key"
                    [options]="tradeDropdownOptions"
                    (click)="resetFormErrors()"
                    (valueChange)="setTradeTypeInProducer($event); resetFormErrors();"
                    class="admin-producer-profile-edit__input">
                </pm-dropdown>
                <pm-input
                    [type]="EPmInputType.NUMBER"
                    [allowEmptyNumber]="true"
                    [name]="localisations.labels.numberOfEmployees"
                    [label]="localisations.labels.numberOfEmployees"
                    [placeholder]="localisations.labels.numberOfEmployees"
                    [value]="producer.numberOfEmployees"
                    (click)="resetFormErrors()"
                    (valueChange)="setNumberOfEmployeesValue($event); resetFormErrors()"
                    class="admin-producer-profile-edit__input">
                </pm-input>
                <pm-dropdown
                    [name]="localisations.labels.state"
                    [label]="localisations.labels.state"
                    [options]="stateDropdownOptions"
                    [value]="this.producer.isActive ? EUserStatus.Active : EUserStatus.InActive"
                    (click)="resetFormErrors()"
                    (valueChange)="setStateInProducer($event); resetFormErrors()"
                    class="admin-producer-profile-edit__input">
                </pm-dropdown>
                <pm-input
                    [type]="EPmInputType.NUMBER"
                    [unit]="localisations.rateUnit"
                    [name]="localisations.labels.rate"
                    [label]="localisations.labels.rate"
                    [placeholder]="localisations.labels.rate"
                    [hasError]="adminProducerProfileEditErrors.rate"
                    [errorMessages]="localisations.inputErrorMessages"
                    [(value)]="producer.rate"
                    [required]="true"
                    (click)="resetFormErrors()"
                    (valueChange)="resetFormErrors()"
                    class="admin-producer-profile-edit__input">
                </pm-input>
            </pm-col>
            <pm-col [gap]="margins.Small">
                <pm-input
                    [type]="EPmInputType.TEXT"
                    [name]="localisations.labels.street"
                    [label]="localisations.labels.street"
                    [placeholder]="localisations.labels.street"
                    [required]="true"
                    [hasError]="adminProducerProfileEditErrors.street"
                    [errorMessages]="localisations.inputErrorMessages"
                    [(value)]="producer.street"
                    (click)="resetFormErrors()"
                    (valueChange)="resetFormErrors()"
                    class="admin-producer-profile-edit__input">
                </pm-input>
                <pm-row class="admin-producer-profile-edit__zip-code-city-row" template="1fr 1fr" [gap]="margins.Small">
                    <pm-input
                        [type]="EPmInputType.TEXT"
                        [name]="localisations.labels.zipCode"
                        [label]="localisations.labels.zipCode"
                        [placeholder]="localisations.labels.zipCode"
                        [hasError]="adminProducerProfileEditErrors.zipCode"
                        [errorMessages]="localisations.inputErrorMessages"
                        [(value)]="producer.zipCode"
                        [required]="true"
                        (click)="resetFormErrors()"
                        (valueChange)="resetFormErrors()"
                        class="admin-producer-profile-edit__input">
                    </pm-input>
                    <pm-input
                        [type]="EPmInputType.TEXT"
                        [name]="localisations.labels.city"
                        [label]="localisations.labels.city"
                        [placeholder]="localisations.labels.city"
                        [hasError]="adminProducerProfileEditErrors.city"
                        [errorMessages]="localisations.inputErrorMessages"
                        [(value)]="producer.city"
                        [required]="true"
                        (click)="resetFormErrors()"
                        (valueChange)="resetFormErrors()"
                        class="admin-producer-profile-edit__input">
                    </pm-input>
                </pm-row>
                <pm-input
                    [type]="EPmInputType.TEXT"
                    [name]="localisations.labels.email"
                    [label]="localisations.labels.email"
                    [placeholder]="localisations.labels.email"
                    [required]="true"
                    [hasError]="adminProducerProfileEditErrors.email"
                    [errorMessages]="localisations.inputErrorMessages"
                    [(value)]="producer.email"
                    (click)="resetFormErrors()"
                    (valueChange)="resetFormErrors()"
                    class="admin-producer-profile-edit__input">
                </pm-input>
                <pm-input
                    [type]="EPmInputType.TEXT"
                    [name]="localisations.labels.phoneNumber"
                    [label]="localisations.labels.phoneNumber"
                    [placeholder]="localisations.labels.phoneNumber"
                    [required]="true"
                    [hasError]="adminProducerProfileEditErrors.phoneNumber"
                    [errorMessages]="localisations.inputErrorMessages"
                    [(value)]="producer.phoneNumber"
                    (click)="resetFormErrors()"
                    (valueChange)="resetFormErrors()"
                    class="admin-producer-profile-edit__input">
                </pm-input>
                <pm-input
                    [type]="EPmInputType.TEXT"
                    [name]="localisations.labels.contactPersonFullName"
                    [label]="localisations.labels.contactPersonFullName"
                    [placeholder]="localisations.labels.contactPersonFullName"
                    [required]="true"
                    [hasError]="adminProducerProfileEditErrors.contactPersonFullName"
                    [errorMessages]="localisations.inputErrorMessages"
                    [(value)]="producer.contactPersonFullName"
                    (click)="resetFormErrors()"
                    (valueChange)="resetFormErrors()"
                    class="admin-producer-profile-edit__input">
                </pm-input>
            </pm-col>
        </pm-row>
        <div class="admin-producer-profile-edit__note">
            <pm-input
                [type]="EPmInputType.TEXTAREA"
                [name]="localisations.labels.note"
                [label]="localisations.labels.note"
                [placeholder]="localisations.notePlaceholder"
                [(value)]="producer.note"
                (valueChange)="resetFormErrors()"
                (click)="resetFormErrors()">
            </pm-input>
        </div>

        <div class="admin-producer-profile-edit__parameters-title">
            {{localisations.parameterTitle}}
        </div>
        <div class="admin-producer-profile-edit__parameters">
            <div *ngFor="let rating of producer.producerRatings"
                 class="admin-producer-profile-edit__parameter">
                <pm-row [template]="'1fr 1fr'">
                    <span class="admin-producer-profile-edit__parameter-label">
                        <span class="admin-producer-profile-edit__parameter-icon">
                            <pm-icon
                                [icon]="Icon.STAR_RATE"
                                [size]="IconSize.S">
                            </pm-icon>
                        </span>
                        {{ rating.type }}{{localisations.ratingTitleSeparation}}
                    </span>
                    <pm-dropdown
                        [name]="rating.type"
                        [required]="true"
                        [value]="rating.rating"
                        [options]="ratingDropdownOptions"
                        (valueChange)="applyRatingChangeToProducer($event, rating.type); resetFormErrors();"
                        (click)="resetFormErrors()"
                        class="admin-producer-profile-edit__input">
                    </pm-dropdown>
                </pm-row>
            </div>
        </div>

        <div footer class="admin-producer-profile-edit__footer">
            <pm-button
                [type]="ButtonType.SECONDARY"
                [label]="localisations.labels.cancel"
                (onClicked)="onCancelClick()"
                class="admin-producer-profile-edit__cancel">
            </pm-button>
            <pm-button
                [type]="ButtonType.PRIMARY"
                [label]="localisations.labels.save"
                (onClicked)="onSaveClick()">
            </pm-button>
        </div>
    </pm-popup>
</div>
