<div class="current-developer-profile">
    <pm-popup
        [type]="PopupType.MEDIUM"
        [title]="localisations.popupTitle"
        (onClose)="onCancelClick()">
        <div class="current-developer-profile__subtitle">
            {{ localisations.popupSubtitle }}
        </div>
        <pm-row template="1fr 1fr" [gap]="margins.XLarge">
            <pm-col [gap]="margins.XSmall">
                <pm-input
                    [type]="EPmInputType.TEXT"
                    [name]="localisations.labels.fullName"
                    [label]="localisations.labels.fullName"
                    [placeholder]="localisations.labels.fullName"
                    [hasError]="developerProfileErrors.fullName"
                    [(value)]="developer.fullName"
                    [required]="true"
                    [errorMessages]="localisations.inputErrorMessages"
                    (click)="resetFormErrors()"
                    (valueChange)="resetFormErrors()"
                    class="current-developer-profile__input">
                </pm-input>
                <pm-input
                    [type]="EPmInputType.TEXT"
                    [name]="localisations.labels.pseudonym"
                    [label]="localisations.labels.pseudonym"
                    [placeholder]="localisations.labels.pseudonym"
                    [disabled]="true"
                    [(value)]="developer.pseudonym"
                    (click)="resetFormErrors()"
                    (valueChange)="resetFormErrors()"
                    class="current-developer-profile__input">
                </pm-input>
                <pm-input
                    [type]="EPmInputType.TEXT"
                    [name]="localisations.labels.street"
                    [label]="localisations.labels.street"
                    [placeholder]="localisations.labels.street"
                    [hasError]="developerProfileErrors.street"
                    [(value)]="developer.street"
                    [required]="true"
                    [errorMessages]="localisations.inputErrorMessages"
                    (click)="resetFormErrors()"
                    (valueChange)="resetFormErrors()"
                    class="current-developer-profile__input">
                </pm-input>
                <pm-row class="current-developer-profile__zip-code-city-row" template="auto auto" [gap]="margins.Small">
                    <pm-input
                        [type]="EPmInputType.TEXT"
                        [name]="localisations.labels.zipCode"
                        [label]="localisations.labels.zipCode"
                        [placeholder]="localisations.labels.zipCode"
                        [hasError]="developerProfileErrors.zipCode"
                        [(value)]="developer.zipCode"
                        [required]="true"
                        [errorMessages]="localisations.inputErrorMessages"
                        (click)="resetFormErrors()"
                        (valueChange)="resetFormErrors()"
                        class="current-developer-profile__input">
                    </pm-input>
                    <pm-input
                        [type]="EPmInputType.TEXT"
                        [name]="localisations.labels.city"
                        [label]="localisations.labels.city"
                        [placeholder]="localisations.labels.city"
                        [hasError]="developerProfileErrors.city"
                        [(value)]="developer.city"
                        [required]="true"
                        [errorMessages]="localisations.inputErrorMessages"
                        (click)="resetFormErrors()"
                        (valueChange)="resetFormErrors()"
                        class="current-developer-profile__input">
                    </pm-input>
                </pm-row>
                <pm-input
                    [type]="EPmInputType.TEXT"
                    [name]="localisations.labels.region"
                    [label]="localisations.labels.region"
                    [placeholder]="localisations.labels.region"
                    [hasError]="developerProfileErrors.region"
                    [(value)]="developer.region"
                    [required]="true"
                    [errorMessages]="localisations.inputErrorMessages"
                    (click)="resetFormErrors()"
                    (valueChange)="resetFormErrors()"
                    class="current-developer-profile__input">
                </pm-input>
            </pm-col>

            <pm-col template="auto auto" [gap]="margins.XSmall">
                <pm-input
                    [type]="EPmInputType.TEXT"
                    [name]="localisations.labels.country"
                    [label]="localisations.labels.country"
                    [placeholder]="localisations.labels.country"
                    [hasError]="developerProfileErrors.country"
                    [required]="true"
                    [(value)]="developer.country"
                    [errorMessages]="localisations.inputErrorMessages"
                    (click)="resetFormErrors()"
                    (valueChange)="resetFormErrors()"
                    class="current-developer-profile__input">
                </pm-input>
                <pm-input
                    [type]="EPmInputType.TEXT"
                    [name]="localisations.labels.email"
                    [label]="localisations.labels.email"
                    [placeholder]="localisations.labels.email"
                    [required]="true"
                    [hasError]="developerProfileErrors.email"
                    [(value)]="developer.email"
                    [errorMessages]="localisations.inputErrorMessages"
                    (click)="resetFormErrors()"
                    (valueChange)="resetFormErrors()"
                    class="current-developer-profile__input">
                </pm-input>
                <pm-input
                    [type]="EPmInputType.TEXT"
                    [name]="localisations.labels.phoneNumber"
                    [label]="localisations.labels.phoneNumber"
                    [placeholder]="localisations.labels.phoneNumber"
                    [required]="true"
                    [hasError]="developerProfileErrors.phoneNumber"
                    [(value)]="developer.phoneNumber"
                    [errorMessages]="localisations.inputErrorMessages"
                    (click)="resetFormErrors()"
                    (valueChange)="resetFormErrors()"
                    class="current-developer-profile__input">
                </pm-input>
                <pm-dropdown
                    [name]="localisations.labels.state"
                    [label]="localisations.labels.state"
                    [placeholder]="localisations.labels.state"
                    [required]="true"
                    [disabled]="true"
                    [(value)]="developer.isActive ? localisations.isActiveState : localisations.isInactiveState"
                    [options]="stateDropdownOptions"
                    [errorMessages]="localisations.inputErrorMessages"
                    (click)="resetFormErrors()"
                    (valueChange)="resetFormErrors()"
                    class="current-developer-profile__input">
                </pm-dropdown>
            </pm-col>
        </pm-row>
        <div footer class="current-developer-profile__footer">
            <pm-button
                [type]="ButtonType.SECONDARY"
                [label]="localisations.labels.cancel"
                (onClicked)="onCancelClick()"
                class="current-developer-profile__cancel">
            </pm-button>
            <pm-button
                [type]="ButtonType.PRIMARY"
                [label]="localisations.labels.save"
                (onClicked)="onSaveClick()">
            </pm-button>
        </div>
    </pm-popup>
</div>
