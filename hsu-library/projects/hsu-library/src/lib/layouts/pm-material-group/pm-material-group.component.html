<pm-banner
    *ngIf="isBannerVisible"
    [bannerText]="localisations.bannerText"
    [bannerType]="BannerType.INFO"
    (onCloseBanner)="onCloseBanner()"
/>
<pm-text
    [type]="TextType.H3"
    [margin]="isAdminView ? titleMarginWithoutDescription : titleMargin"
> {{localisations.titleText}}</pm-text>
<pm-text
    *ngIf="!isAdminView"
    [type]="TextType.COPY_M1"
    [margin]="descriptionMargin"
> {{localisations.descriptionText}}</pm-text>
<pm-row template="1fr 1fr 1fr 1fr" [gap]="margins.XLarge">
    <pm-col
        *ngFor="let materialGroup of materialGroups"
        [gap]="margins.Medium"
        template="auto"
    >
        <pm-checkbox
            [state]="hasMaterialGroupItems[materialGroup.materialGroupId] ? PmCheckboxState.ACTIVE : PmCheckboxState.DEFAULT"
            (stateChange)="handleCheckboxActivation($event, materialGroup)"
            [label]="materialGroup.localizedName"
            [checkboxId]="'material-group_' + materialGroup.materialGroupId"
        />
        <pm-material-item
            *ngIf="hasMaterialGroupItems[materialGroup.materialGroupId]"
            [materialGroupId]="materialGroup.materialGroupId"
            [surfaceFinishes]="materialGroup.options"
            [localisations]="localisations.materialItem"
            [(workingPieces)]="workingPieces[materialGroup.materialGroupId]"
            (workingPiecesChange)="emitWorkingPieces()"
            (workingPieceDeleted)="onWorkingPieceDeleted($event)"
        />
    </pm-col>
</pm-row>
