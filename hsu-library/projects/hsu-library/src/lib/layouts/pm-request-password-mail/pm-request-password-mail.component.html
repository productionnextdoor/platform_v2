<div class="request-password-mail">
    <pm-popup *ngIf="showSuccessPopUp"
              [title]="localisations.successPopUp.title"
              (onClose)="closePopUp()"
    >
        {{ localisations.successPopUp.text }}
        <ng-container footer>
            <div class="request-password-mail__popup-footer">
                <pm-button
                    [type]="EButtonType.PRIMARY"
                    [label]="localisations.successPopUp.confirmButtonText"
                    (onClicked)="closePopUp()">
                </pm-button>
            </div>
        </ng-container>
    </pm-popup>
    <pm-logo-screen
        [logoPath]="logoPath"
    >
        <pm-card
            [title]="localisations.form.title"
        >
            <pm-col
                [gap]="DefaultMargins.XLarge"
                template="1fr auto"
            >
                <div class="request-password-mail__form-text">
                    {{localisations.form.text}}
                </div>
                <pm-input
                    [type]="EPmInputType.EMAIL"
                    [name]="email"
                    [label]="localisations.form.emailLabel"
                    [placeholder]="localisations.form.emailLabel"
                    [required]="true"
                    [(value)]="email"
                    (click)="hasError = false"
                    [hasError] ="hasError"
                    [errorMessages]="[localisations.form.emailNotValidError]"
                />
            </pm-col>
            <pm-row footer
                    template="auto auto 1fr"
                    [gap]="DefaultMargins.Medium"
            >
                <pm-button
                    class="request-password-mail__button"
                    [type]="EButtonType.SECONDARY"
                    [label]="localisations.form.backButtonText"
                    (onClicked)="onBack.emit();"
                >
                </pm-button>
                <pm-button
                    class="request-password-mail__button"
                    [type]="EButtonType.PRIMARY"
                    [label]="localisations.form.confirmButtonText"
                    (onClicked)="onSubmitButtonClick()"
                    [disabled]="email === ''">
                >
                </pm-button>
            </pm-row>
            <pm-row footer
                    template="auto auto 1fr"
                    class="request-password-mail__imprint"
                    [gap]="DefaultMargins.XSmall">
                <pm-text
                    class="request-password-mail__imprint-item"
                    *ngFor="let imprint of imprintLinks"
                    [type]="TextType.COPY_S1"
                    (click)="onImprintLinkClicked(imprint)"
                >
                    {{imprint.title}}
                </pm-text>
            </pm-row>
        </pm-card>
    </pm-logo-screen>
</div>
