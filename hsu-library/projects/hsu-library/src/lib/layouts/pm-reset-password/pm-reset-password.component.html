<div class="request-password">
    <pm-logo-screen [logoPath]="logoPath">
        <pm-card class="reset-password__form"
                 [title]="localisations.title">
            <pm-col [gap]="DefaultMargins.Small">
                {{localisations.text}}
                <pm-input
                    [type]="EPmInputType.PASSWORD"
                    [label]="localisations.passwordLabel"
                    [placeholder]="localisations.passwordLabel"
                    [required]="true"
                    [(value)]="password"
                    (click)="resetValidation()"
                    [hasError]="hasError"
                    [errorMessages]="errorMessages"
                />
                <pm-input
                    [type]="EPmInputType.PASSWORD"
                    [label]="localisations.repeatPasswordLabel"
                    [placeholder]="localisations.repeatPasswordLabel"
                    [required]="true"
                    (click)="resetValidation()"
                    [(value)]="repeatedPassword"
                    [hasError]="hasError"
                    [errorMessages]="[localisations.errorTexts.passwordMismatch]"
                />
            </pm-col>
            <pm-row footer
                    template="auto auto 1fr"
                    class="reset-password__buttons"
                    [gap]="DefaultMargins.Medium">
                <pm-button
                    [type]="EButtonType.SECONDARY"
                    [label]="localisations.backButtonText"
                    (onClicked)="onBack.emit();">
                </pm-button>
                <pm-button
                    [type]="EButtonType.PRIMARY"
                    [label]="localisations.confirmButtonText"
                    (onClicked)="onSubmitButtonClick()"
                    [disabled]="password === ''">
                </pm-button>
            </pm-row>
            <pm-row footer
                    template="auto auto 1fr"
                    class="reset-password__imprint"
                    [gap]="DefaultMargins.XSmall">
                <pm-text
                    class="reset-password__imprint-item"
                    *ngFor="let imprint of imprintLinks"
                    [type]="TextType.COPY_S1"
                    (click)="onImprintLinkClicked(imprint)"
                >
                    {{imprint.title}}
                </pm-text>
            </pm-row>
        </pm-card>
    </pm-logo-screen>
</div>
