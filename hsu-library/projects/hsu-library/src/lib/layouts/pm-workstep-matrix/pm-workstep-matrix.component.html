<div class="workstep-matrix" [style.--extra-columns]="columnCount">
  <div class="workstep-matrix__header">
    <div class="workstep-matrix__header-cell workstep-matrix__header-cell--row-label"></div>
    <div *ngFor="let column of matrixData.columns"
         class="workstep-matrix__header-cell"
         [ngClass]="{
           'workstep-matrix__header-cell--standard': column.isStandard,
           'workstep-matrix__header-cell--fill-active': isColumnFillActive(column)
         }">
      <div class="workstep-matrix__header-title-row">
        <pm-text [type]="TextType.H4">
          {{ column.measurementName }}
          <span *ngIf="column.isStandard" class="workstep-matrix__required-indicator">
            {{ localisations.requiredFieldIndicator }}
          </span>
        </pm-text>
        <button *ngIf="!readonly"
            class="workstep-matrix__fill-btn-calc"
            [ngClass]="{'workstep-matrix__fill-btn-calc--active': isColumnFillActive(column)}"
            (click)="openColumnFillPopover(column); $event.stopPropagation()"
            [title]="localisations.fillAssistant.title">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zM6.25 7.72h11.5v2.56H6.25V7.72zM6.25 12h2.5v2.5h-2.5V12zm4.25 0h2.5v2.5h-2.5V12zm4.25 0h2.5v5.28h-2.5V12zM6.25 16h2.5v1.28h-2.5V16zm4.25 0h2.5v1.28h-2.5V16z"/>
          </svg>
        </button>
      </div>
      <pm-checkbox
        *ngIf="!readonly && !column.isStandard"
        [label]="localisations.sizeCheckboxLabel"
        [state]="column.canProduce"
        [disabled]="readonly"
        (stateChange)="onColumnCheckboxChange(column, $event)"
      ></pm-checkbox>

      <!-- Column fill popover -->
      <pm-matrix-fill-popover
        *ngIf="activePopoverColumnId === column.columnId"
        [localisations]="localisations.fillAssistant"
        [sourceOptions]="columnFillSourceOptions"
        [currentRule]="column.fillRule"
        (onApply)="onColumnFillApply(column, $event)"
        (onCancel)="closeAllPopovers()"
      ></pm-matrix-fill-popover>
    </div>
  </div>

  <div class="workstep-matrix__body">
    <div *ngFor="let row of matrixData.rows; let i = index"
         class="workstep-matrix__row"
         [ngClass]="{
           'workstep-matrix__row--material': row.rowType === EMatrixRowType.MATERIAL_VARIANT,
           'workstep-matrix__row--first-non-material': isFirstNonMaterialRow(row, i),
           'workstep-matrix__row--fill-active': isRowFillActive(row)
         }"
>

      <!-- Row Label -->
      <div class="workstep-matrix__row-label">
        <pm-text [type]="TextType.COPY_M1" *ngIf="row.rowType !== EMatrixRowType.MATERIAL_VARIANT">
          {{ row.label }}
        </pm-text>
        <div *ngIf="row.rowType === EMatrixRowType.MATERIAL_VARIANT" class="workstep-matrix__material-label">
          <div class="workstep-matrix__material-title-row">
            <pm-text [type]="TextType.H4" [margin]="materialTextMargin">
              <span class="workstep-matrix__material-group">{{ row.description?.group }}:</span>
              {{ row.description?.material }}
            </pm-text>
            <button *ngIf="!readonly"
                class="workstep-matrix__fill-btn-calc"
                [ngClass]="{'workstep-matrix__fill-btn-calc--active': isRowFillActive(row)}"
                (click)="openRowFillPopover(row); $event.stopPropagation()"
                [title]="localisations.fillAssistant.title">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zM6.25 7.72h11.5v2.56H6.25V7.72zM6.25 12h2.5v2.5h-2.5V12zm4.25 0h2.5v2.5h-2.5V12zm4.25 0h2.5v5.28h-2.5V12zM6.25 16h2.5v1.28h-2.5V16zm4.25 0h2.5v1.28h-2.5V16z"/>
              </svg>
            </button>
          </div>
          <pm-checkbox
            *ngIf="!readonly && !row.isStandard"
            [label]="localisations.checkboxLabel"
            [state]="row.canProduce ?? PmCheckboxState.DEFAULT"
            [disabled]="readonly"
            (stateChange)="onCheckboxChange(row, $event)"
          ></pm-checkbox>

          <!-- Row fill popover -->
          <pm-matrix-fill-popover
            *ngIf="activePopoverRowId === row.rowId"
            [localisations]="localisations.fillAssistant"
            [sourceOptions]="rowFillSourceOptions"
            [currentRule]="row.fillRule"
            (onApply)="onRowFillApply(row, $event)"
            (onCancel)="closeAllPopovers()"
          ></pm-matrix-fill-popover>
        </div>
      </div>

      <!-- Cells - direkt als Grid-Items, kein separates Grid -->
      <div *ngFor="let cell of row.cells; let cellIndex = index"
           class="workstep-matrix__cell"
           [ngClass]="{'workstep-matrix__cell--fill-computed': row.rowType === EMatrixRowType.MATERIAL_VARIANT && isRowFillActive(row)}">

          <!-- Material cost cell -->
          <div *ngIf="row.rowType === EMatrixRowType.MATERIAL_VARIANT" class="workstep-matrix__material-cell">
            <pm-input
              [type]="EPmInputType.NUMBER"
              [unit]="localisations.inputUnit"
              [label]="localisations.materialCostLabel"
              [required]="cell.isRequired"
              [disabled]="!cell.isEditable"
              [allowEmptyNumber]="false"
              [value]="cell.value"
              (valueChange)="onCellValueChange(row, cellIndex, $event)"
            />
          </div>

          <!-- Work cost cell -->
          <pm-input
            *ngIf="row.rowType === EMatrixRowType.WORK_COST"
            [type]="EPmInputType.NUMBER"
            [unit]="localisations.inputUnit"
            [label]="localisations.workCostLabel"
            [required]="cell.isRequired"
            [disabled]="!cell.isEditable"
            [allowEmptyNumber]="true"
            [value]="cell.value"
            (valueChange)="onCellValueChange(row, cellIndex, $event)"
          />

          <!-- Work hours cell -->
          <pm-input
            *ngIf="row.rowType === EMatrixRowType.WORK_HOURS"
            [type]="EPmInputType.NUMBER"
            [unit]="localisations.hourlyInputUnit"
            [label]="localisations.workHoursLabel"
            [required]="cell.isRequired"
            [disabled]="!cell.isEditable"
            [allowEmptyNumber]="true"
            [value]="cell.value"
            (valueChange)="onCellValueChange(row, cellIndex, $event)"
          />

          <!-- Transport cost cell -->
          <pm-input
            *ngIf="row.rowType === EMatrixRowType.TRANSPORT_COST"
            [type]="EPmInputType.NUMBER"
            [unit]="localisations.inputUnit"
            [label]="localisations.transportCostLabel"
            [required]="cell.isRequired"
            [disabled]="!cell.isEditable"
            [allowEmptyNumber]="false"
            [value]="cell.value"
            (valueChange)="onCellValueChange(row, cellIndex, $event)"
          />

          <!-- Processing time cell -->
          <pm-input
            *ngIf="row.rowType === EMatrixRowType.PROCESSING_TIME"
            [type]="EPmInputType.NUMBER"
            [unit]="localisations.weeklyInputUnit"
            [label]="localisations.processingTimeLabel"
            [required]="cell.isRequired"
            [disabled]="!cell.isEditable"
            [allowEmptyNumber]="true"
            [value]="cell.value"
            (valueChange)="onCellValueChange(row, cellIndex, $event)"
          />
      </div>
    </div>
  </div>
</div>
