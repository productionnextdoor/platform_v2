<pm-row template="1fr 1fr" [gap]="margins.Small">
    <pm-card
        [hasHeader]="true"
        [title]="title"
        [noShadow]="false"
    >
        <pm-row [template]="'9fr 1fr'" [gap]="margins.Large">
            <div class="delivery-documents-card__column">
                <div *ngFor="let properties of fileList"
                     class="delivery-documents-card__document">
                    <pm-icon
                        [icon]="properties.value | FiletypeIcon"
                        [size]="IconSize.XXS"
                        class="delivery-documents-card__document-icon"
                    />
                    <pm-text
                        [type]="TextType.COPY_M1"
                        class="delivery-documents-card__document-text"
                    >
                        {{ properties.value }}
                    </pm-text>
                </div>
            </div>
            <pm-button
                [disabled]="fileList.length == 0"
                [type]="ButtonType.ICON"
                [icon]="Icon.DOWNLOAD"
                (onClicked)="onDownloadClick.emit()"
            ></pm-button>
        </pm-row>
    </pm-card>
</pm-row>
