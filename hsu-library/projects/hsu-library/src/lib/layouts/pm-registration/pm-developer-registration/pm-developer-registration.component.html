<div class="developer-registration">
    <pm-logo-screen
        [logoPath]="logoPath"
        [hasLimitWidth]="false"
    >
        <div class="developer-registration__card">
            <pm-card
                [hasHeader]="true"
                [title]="localisations.title"
            >
                <div *ngIf="visibleNote" class="developer-registration__banner">
                    <pm-banner
                        [bannerText]="localisations.bannerText"
                        [bannerType]="BannerType.INFO"
                        (onCloseBanner)="onCLoseBanner()"
                    />
                </div>
                <pm-row [template]="'1fr 1fr'" [gap]="margins.XLarge">
                    <pm-col [gap]="margins.XSmall">
                        <pm-input
                            [type]="EPmInputType.TEXT"
                            [name]="localisations.labels.fullName"
                            [label]="localisations.labels.fullName"
                            [placeholder]="localisations.placeholder.fullName"
                            [hasError]="developerRegistrationErrors.fullName"
                            [(value)]="developer.fullName"
                            [required]="true"
                            [errorMessages]="localisations.inputErrorMessages"
                            (click)="resetFormErrors()"
                            class="developer-registration__input">
                        </pm-input>
                        <pm-input
                            [type]="EPmInputType.TEXT"
                            [name]="localisations.labels.pseudonym"
                            [label]="localisations.labels.pseudonym"
                            [placeholder]="localisations.placeholder.pseudonym"
                            [hasError]="developerRegistrationErrors.pseudonym"
                            [(value)]="developer.pseudonym"
                            [required]="true"
                            [errorMessages]="localisations.inputErrorMessages"
                            (click)="resetFormErrors()"
                            class="developer-registration__input">
                        </pm-input>
                        <pm-input
                            [type]="EPmInputType.TEXT"
                            [name]="localisations.labels.street"
                            [label]="localisations.labels.street"
                            [placeholder]="localisations.placeholder.street"
                            [hasError]="developerRegistrationErrors.street"
                            [(value)]="developer.street"
                            [required]="true"
                            [errorMessages]="localisations.inputErrorMessages"
                            (click)="resetFormErrors()"
                            class="developer-registration__input">
                        </pm-input>
                        <pm-row
                            class="developer-registration__zip-code-city-row"
                            template="auto auto"
                            [gap]="margins.Small"
                        >
                            <pm-input
                                [type]="EPmInputType.TEXT"
                                [name]="localisations.labels.zipCode"
                                [label]="localisations.labels.zipCode"
                                [placeholder]="localisations.placeholder.zipCode"
                                [hasError]="developerRegistrationErrors.zipCode"
                                [(value)]="developer.zipCode"
                                [required]="true"
                                [errorMessages]="localisations.inputErrorMessages"
                                (click)="resetFormErrors()"
                                class="developer-registration__input">
                            </pm-input>
                            <pm-input
                                [type]="EPmInputType.TEXT"
                                [name]="localisations.labels.city"
                                [label]="localisations.labels.city"
                                [placeholder]="localisations.placeholder.city"
                                [hasError]="developerRegistrationErrors.city"
                                [(value)]="developer.city"
                                [required]="true"
                                [errorMessages]="localisations.inputErrorMessages"
                                (click)="resetFormErrors()"
                                class="developer-registration__input">
                            </pm-input>
                        </pm-row>
                        <pm-input
                            [type]="EPmInputType.TEXT"
                            [name]="localisations.labels.region"
                            [label]="localisations.labels.region"
                            [placeholder]="localisations.placeholder.region"
                            [hasError]="developerRegistrationErrors.region"
                            [(value)]="developer.region"
                            [required]="true"
                            [errorMessages]="localisations.inputErrorMessages"
                            (click)="resetFormErrors()"
                            class="developer-registration__input">
                        </pm-input>
                    </pm-col>

                    <pm-col template="auto auto" [gap]="margins.XSmall">
                        <pm-input
                            [type]="EPmInputType.TEXT"
                            [name]="localisations.labels.country"
                            [label]="localisations.labels.country"
                            [placeholder]="localisations.placeholder.country"
                            [hasError]="developerRegistrationErrors.country"
                            [required]="true"
                            [(value)]="developer.country"
                            [errorMessages]="localisations.inputErrorMessages"
                            (click)="resetFormErrors()"
                            class="developer-registration__input">
                        </pm-input>
                        <pm-input
                            [type]="EPmInputType.EMAIL"
                            [name]="localisations.labels.mail"
                            [label]="localisations.labels.mail"
                            [placeholder]="localisations.placeholder.mail"
                            [required]="true"
                            [hasError]="developerRegistrationErrors.mail"
                            [(value)]="developer.email"
                            [errorMessages]="localisations.inputErrorMessages"
                            (click)="resetFormErrors()"
                            class="developer-registration__input">
                        </pm-input>
                        <pm-input
                            [type]="EPmInputType.TEXT"
                            [name]="localisations.labels.phoneNumber"
                            [label]="localisations.labels.phoneNumber"
                            [placeholder]="localisations.placeholder.phoneNumber"
                            [required]="true"
                            [hasError]="developerRegistrationErrors.phoneNumber"
                            [(value)]="developer.phoneNumber"
                            [errorMessages]="localisations.inputErrorMessages"
                            (click)="resetFormErrors()"
                            class="developer-registration__input">
                        </pm-input>
                        <pm-input
                            [type]="EPmInputType.PASSWORD"
                            [label]="localisations.labels.password"
                            [placeholder]="localisations.placeholder.password"
                            [required]="true"
                            [(value)]="developer.password"
                            [hasError]="developerRegistrationErrors.password"
                            [errorMessages]="errorMessages"
                            (click)="resetFormErrors()"
                            class="developer-registration__input">
                        </pm-input>
                        <pm-input
                            [type]="EPmInputType.PASSWORD"
                            [label]="localisations.labels.repeatPassword"
                            [placeholder]="localisations.placeholder.repeatPassword"
                            [required]="true"
                            [(value)]="developer.repeatedPassword"
                            [hasError]="developerRegistrationErrors.repeatedPassword"
                            [errorMessages]="[localisations.passwordErrorTexts.passwordMismatch]"
                            (click)="resetFormErrors()"
                            class="developer-registration__input">
                        </pm-input>
                        <pm-row
                            class="developer-registration__imprint"
                            template="auto auto auto auto auto 1fr"
                            [gap]="margins.XXSmall">
                            <pm-checkbox
                                [state]="agbAndTerms"
                                [hasError]="developerRegistrationErrors.agbAndTerms"
                                (stateChange)="onAgbAndTermsChange($event)"
                            />
                            <pm-text
                                class="developer-registration__imprint-text"
                                [type]="TextType.COPY_S1">
                                {{localisations.labels.acceptTermsAndPrivacyPartOne}}
                            </pm-text>
                            <pm-text
                                class="developer-registration__imprint-link"
                                [type]="TextType.COPY_S1"
                                (click)="onImprintLinkClicked(termsAndConditionLink)">
                                {{termsAndConditionLink.title}}
                            </pm-text>
                            <pm-text
                                class="developer-registration__imprint-text"
                                [type]="TextType.COPY_S1">
                                {{localisations.labels.acceptTermsAndPrivacyPartTwo}}
                            </pm-text>
                            <pm-text
                                class="developer-registration__imprint-link"
                                [type]="TextType.COPY_S1"
                                (click)="onImprintLinkClicked(privacyPolicyLink)">
                                {{privacyPolicyLink.title}}
                            </pm-text>
                        </pm-row>
                    </pm-col>
                </pm-row>

                <div footer class="developer-registration__footer">
                    <pm-button
                        [type]="ButtonType.PRIMARY"
                        [label]="localisations.labels.register"
                        (onClicked)="onRegisterClick()">
                    </pm-button>
                </div>
            </pm-card>
        </div>
    </pm-logo-screen>
</div>
