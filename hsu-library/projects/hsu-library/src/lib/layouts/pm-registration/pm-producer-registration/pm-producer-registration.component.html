<div class="producer-registration">
    <pm-logo-screen
        [logoPath]="logoPath"
        [hasLimitWidth]="false"
    >
        <div class="producer-registration__card">
            <pm-card
                [hasHeader]="true"
                [title]="localisations.title"
            >
                <pm-row [template]="'1fr 1fr'" [gap]="margins.XLarge">
                    <pm-col [gap]="margins.XSmall">
                        <pm-input
                            [type]="EPmInputType.TEXT"
                            [name]="localisations.labels.companyName"
                            [label]="localisations.labels.companyName"
                            [placeholder]="localisations.placeholder.companyName"
                            [hasError]="producerRegistrationErrors.companyName"
                            [(value)]="producer.companyName"
                            [required]="true"
                            [errorMessages]="localisations.inputErrorMessages"
                            (click)="resetFormErrors()"
                            class="producer-registration__input"
                        />
                        <pm-dropdown
                            [name]="localisations.labels.tradeType"
                            [label]="localisations.labels.tradeType"
                            [placeholder]="localisations.labels.tradeType"
                            [required]="true"
                            [disabled]="true"
                            [value]="this.producer?.trade?.key"
                            [options]="tradeDropdownOptions"
                            (click)="resetFormErrors()"
                            (valueChange)="setTradeTypeInProducer($event)"
                            class="producer-registration__input"
                        />
                        <pm-input
                            [type]="EPmInputType.TEXT"
                            [name]="localisations.labels.employees"
                            [label]="localisations.labels.employees"
                            [placeholder]="localisations.placeholder.employees"
                            [hasError]="producerRegistrationErrors.employees"
                            [(value)]="producer.numberOfEmployees"
                            [required]="true"
                            [errorMessages]="localisations.inputErrorMessages"
                            (click)="resetFormErrors()"
                            class="producer-registration__input"
                        />
                        <pm-dropdown
                            [name]="localisations.labels.state"
                            [label]="localisations.labels.state"
                            [placeholder]="this.getStateDropdownPlaceholder()"
                            [disabled]=" true"
                            [options]="stateDropdownOptions"
                            [value]="this.producer.isActive ? EUserStatus.Active : EUserStatus.InActive"
                            (click)="resetFormErrors()"
                            (valueChange)="setStateInProducer($event)"
                            class="producer-registration__input"
                        />
                        <pm-input
                            [type]="EPmInputType.NUMBER"
                            [unit]="localisations.hourlyWageUnit"
                            [name]="localisations.labels.hourlyWage"
                            [label]="localisations.labels.hourlyWage"
                            [placeholder]="localisations.placeholder.hourlyWage"
                            [hasError]="producerRegistrationErrors.hourlyWage"
                            [(value)]="producer.hourlyWage"
                            [required]="true"
                            [errorMessages]="localisations.inputErrorMessages"
                            (click)="resetFormErrors()"
                            class="producer-registration__input"
                        />
                        <pm-input
                            [type]="EPmInputType.TEXT"
                            [name]="localisations.labels.contactPerson"
                            [label]="localisations.labels.contactPerson"
                            [placeholder]="localisations.placeholder.contactPerson"
                            [hasError]="producerRegistrationErrors.contactPerson"
                            [(value)]="producer.contactPersonFullName"
                            [required]="true"
                            [errorMessages]="localisations.inputErrorMessages"
                            (click)="resetFormErrors()"
                            class="producer-registration__input"
                        />
                    </pm-col>

                    <pm-col template="auto auto" [gap]="margins.XSmall">
                        <pm-input
                            [type]="EPmInputType.TEXT"
                            [name]="localisations.labels.street"
                            [label]="localisations.labels.street"
                            [placeholder]="localisations.placeholder.street"
                            [hasError]="producerRegistrationErrors.street"
                            [(value)]="producer.street"
                            [required]="true"
                            [errorMessages]="localisations.inputErrorMessages"
                            (click)="resetFormErrors()"
                            class="producer-registration__input"
                        />
                        <pm-row class="producer-registration__zip-code-city-row" template="auto auto" [gap]="margins.Small">
                            <pm-input
                                [type]="EPmInputType.TEXT"
                                [name]="localisations.labels.zipCode"
                                [label]="localisations.labels.zipCode"
                                [placeholder]="localisations.placeholder.zipCode"
                                [hasError]="producerRegistrationErrors.zipCode"
                                [(value)]="producer.zipCode"
                                [required]="true"
                                [errorMessages]="localisations.inputErrorMessages"
                                (click)="resetFormErrors()"
                                class="producer-registration"
                            />
                            <pm-input
                                [type]="EPmInputType.TEXT"
                                [name]="localisations.labels.city"
                                [label]="localisations.labels.city"
                                [placeholder]="localisations.placeholder.city"
                                [hasError]="producerRegistrationErrors.city"
                                [(value)]="producer.city"
                                [required]="true"
                                [errorMessages]="localisations.inputErrorMessages"
                                (click)="resetFormErrors()"
                                class="producer-registration__input"
                            />
                        </pm-row>
                        <pm-input
                            [type]="EPmInputType.EMAIL"
                            [name]="localisations.labels.mail"
                            [label]="localisations.labels.mail"
                            [placeholder]="localisations.placeholder.mail"
                            [required]="true"
                            [hasError]="producerRegistrationErrors.mail"
                            [(value)]="producer.email"
                            [errorMessages]="localisations.inputErrorMessages"
                            (click)="resetFormErrors()"
                            class="producer-registration__input"
                        />
                        <pm-input
                            [type]="EPmInputType.TEXT"
                            [name]="localisations.labels.phoneNumber"
                            [label]="localisations.labels.phoneNumber"
                            [placeholder]="localisations.placeholder.phoneNumber"
                            [required]="true"
                            [hasError]="producerRegistrationErrors.phoneNumber"
                            [(value)]="producer.phoneNumber"
                            [errorMessages]="localisations.inputErrorMessages"
                            (click)="resetFormErrors()"
                            class="producer-registration__input"
                        />
                        <pm-input
                            [type]="EPmInputType.PASSWORD"
                            [label]="localisations.labels.password"
                            [placeholder]="localisations.placeholder.password"
                            [required]="true"
                            [(value)]="producer.password"
                            [hasError]="producerRegistrationErrors.password"
                            [errorMessages]="errorMessages"
                            (click)="resetFormErrors()"
                            class="producer-registration__input"
                        />
                        <pm-input
                            [type]="EPmInputType.PASSWORD"
                            [label]="localisations.labels.repeatPassword"
                            [placeholder]="localisations.placeholder.repeatPassword"
                            [required]="true"
                            [(value)]="producer.repeatedPassword"
                            [hasError]="producerRegistrationErrors.repeatedPassword"
                            [errorMessages]="[localisations.passwordErrorTexts.passwordMismatch]"
                            (click)="resetFormErrors()"
                            class="producer-registration__input"
                        />
                        <pm-row
                            class="producer-registration__imprint"
                            template="auto auto auto auto auto 1fr"
                            [gap]="margins.XXSmall">
                            <pm-checkbox
                                [state]="agbAndTerms"
                                [hasError]="producerRegistrationErrors.agbAndTerms"
                                (stateChange)="onAgbAndTermsChange($event)"
                            />
                            <pm-text
                                class="producer-registration__imprint-text"
                                [type]="TextType.COPY_S1">
                                {{localisations.labels.acceptTermsAndPrivacyPartOne}}
                            </pm-text>
                            <pm-text
                                class="producer-registration__imprint-link"
                                [type]="TextType.COPY_S1"
                                (click)="onImprintLinkClicked(termsAndConditionLink)">
                                {{termsAndConditionLink.title}}
                            </pm-text>
                            <pm-text
                                class="producer-registration__imprint-text"
                                [type]="TextType.COPY_S1">
                                {{localisations.labels.acceptTermsAndPrivacyPartTwo}}
                            </pm-text>
                            <pm-text
                                class="producer-registration__imprint-link"
                                [type]="TextType.COPY_S1"
                                (click)="onImprintLinkClicked(privacyPolicyLink)">
                                {{privacyPolicyLink.title}}
                            </pm-text>
                        </pm-row>
                    </pm-col>
                </pm-row>

                <div footer class="producer-registration__footer">
                    <pm-button
                        [type]="ButtonType.PRIMARY"
                        [label]="localisations.labels.register"
                        (onClicked)="onRegisterClick()"
                    />
                </div>
            </pm-card>
        </div>
    </pm-logo-screen>
</div>
