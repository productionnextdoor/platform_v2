<div class="steps">
    <div class="steps__wrapper" *ngFor="let step of steps"
         [ngClass]="{
            'steps__wrapper--disabled': step.disabled,
            'steps__wrapper--active': step.active,
       }"
    >
        <div class="steps__wrapper__title"
             (mouseup)="this.onClickHandler($event, step)"
        >
            {{step.title}}
        </div>
    </div>
</div>
